services:
  neurogenui:
    build: .
    image: neurogenui:latest
    container_name: neurogenui
    ports:
      - "8200:8200"
    env_file:
      - .env
    environment:
      NGUI_BROWSER: chromium
    volumes:
      - neurogenui-data:/app/backend/data
    restart: unless-stopped

volumes:
  neurogenui-data:
